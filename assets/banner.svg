<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Tab Copy</title>
  <desc id="desc">Minimal black and white banner for the Tab Copy browser extension.</desc>
  <rect width="1600" height="520" fill="#fff"/>
  <rect x="32" y="32" width="1536" height="456" fill="#fff" stroke="#000" stroke-width="4"/>
  <line x1="32" y1="130" x2="1568" y2="130" stroke="#000" stroke-width="4"/>
  <line x1="1120" y1="130" x2="1120" y2="488" stroke="#000" stroke-width="4"/>

  <text x="72" y="98" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" letter-spacing="10">TAB COPY</text>
  <text x="1496" y="98" text-anchor="end" font-family="Courier New, monospace" font-size="24" font-weight="700">06 / 09</text>

  <text x="72" y="240" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-3">COPY LESS.</text>
  <text x="72" y="326" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="-3">COPY RIGHT.</text>
  <text x="76" y="400" font-family="Courier New, monospace" font-size="21" font-weight="700" letter-spacing="2">SELECT TABS. SHIFT CLICK A RANGE. COPY URLS.</text>

  <g transform="translate(1168 176)">
    <rect width="344" height="54" fill="#000"/>
    <rect x="18" y="18" width="18" height="18" fill="#fff"/>
    <text x="58" y="35" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#fff">Documentation</text>

    <rect y="72" width="344" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
    <rect x="18" y="90" width="18" height="18" fill="#000"/>
    <text x="58" y="107" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">GitHub</text>

    <rect y="144" width="344" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
    <rect x="18" y="162" width="18" height="18" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="58" y="179" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Inbox</text>

    <rect y="230" width="150" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="75" y="264" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="700">NONE</text>
    <rect x="168" y="230" width="176" height="54" fill="#000"/>
    <text x="256" y="264" text-anchor="middle" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#fff">COPY</text>
  </g>
</svg>
